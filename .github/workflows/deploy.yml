# Build → test → deploy to GitHub Pages (SPEC.md "Deploy" section).
# Tests and the core-purity check GATE the deploy: red engine = no ship.
name: deploy

on:
  push:
    branches:
      - claude/incremental-game-github-pages-w7pvk6 # pinned deploy branch (no main)
      - claude/project-review-build-shub7f # build-session branch (same site; latest push wins)
      # CI on the dev branch too. Four commits shipped without it ever
      # running — no tests, no core-purity check, no attribution gate. The
      # `deploy` job below stays gated to the pinned branch, so this buys the
      # checks without any publishing risk.
      - claude/knowledge-recovery-ontology-game-g0f9q0
  workflow_dispatch:

# Least privilege (SPEC): nothing beyond what deploy-pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx svelte-check --tsconfig ./tsconfig.json --fail-on-warnings false
      - name: Test (gates deploy)
        run: npx vitest run

      - name: Core-purity check
        # core/ must stay headless: no DOM globals, no clock, no RNG, no imports
        # from ui/render/shell. Was an inline grep over raw text, which flagged
        # the WORD "window" in a comment and silently blocked every deploy for a
        # day and a half — the build and deploy steps just get skipped, which
        # from outside is indistinguishable from a deploy. Now a script that
        # strips comments and strings first, with its red path tested.
        run: node scripts/check-core-purity.mjs
      - name: Player-facing vocabulary is single-sourced
        # The dock said "graph: 25 nodes" while the HUD said "3 recovered" — two
        # different quantities wearing one word, because each surface reached
        # into raw state and picked its own. src/core/readouts.ts is the single
        # place a player-facing number is named; this keeps surfaces on it.
        run: node scripts/check-vocabulary.mjs
      - name: Ontology data present and self-describing
        # The committed build output is the game's content; a deploy without it
        # ships a world with no concepts in it.
        run: |
          test -f public/ontology/index.json || { echo '::error::public/ontology/index.json missing — run npm run ontology'; exit 1; }
          test -f public/ontology/LICENSE.txt || { echo '::error::public/ontology/LICENSE.txt missing — the notice must ship WITH the data'; exit 1; }
          node -e '
            const m = require("./public/ontology/index.json");
            // CC BY 4.0 s3(a)(1) needs BOTH parties, the licence and a link —
            // truthiness is not enough, so assert the content.
            if (!m.license || !m.licenseUrl || !m.attribution) { console.error("::error::ontology manifest is missing licence/licenceUrl/attribution"); process.exit(1); }
            if (!/Princeton/.test(m.attribution) || !/Open English WordNet/.test(m.attribution)) {
              console.error("::error::attribution must name BOTH Princeton WordNet and the Open English WordNet team"); process.exit(1);
            }
            const fs = require("fs");
            for (let i = 0; i < m.chunks; i++) {
              const f = `public/ontology/c${String(i).padStart(3, "0")}.json`;
              if (!fs.existsSync(f)) { console.error(`::error::missing ontology chunk ${f}`); process.exit(1); }
            }
            console.log(`ontology ok: ${m.concepts} concepts, ${m.chunks} chunks, ${m.source} ${m.edition} (${m.license})`);
          '
      - run: npx vite build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ── The visual gate runs BESIDE the deploy, not in front of it ─────────────
  #
  # Geometry only exists once CSS has run, so the only honest way to check it is
  # to run CSS — that is why this exists, and it earns its keep (it is what
  # caught the graph sitting 30px off centre while every unit test was green).
  # But it drives a real browser through ~75 seconds of waiting, and when it was
  # a step inside `build` its slowness sat directly on top of the publish: one
  # run held the deploy for nine minutes, and a timeout would have failed the
  # publish over a browser that was merely slow.
  #
  # So the gates that block a publish are the fast, deterministic ones —
  # typecheck, unit tests, core purity, ontology/licence. This one reports on
  # its own line in the Actions list: red when the layout is genuinely broken,
  # loud when it could not run, and never able to take the site down with it.
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Alignment invariant (real browser)
        run: |
          npm run build
          npx vite preview --port 4321 --strictPort > /tmp/preview.log 2>&1 &
          node -e '
            const t0 = Date.now();
            (async () => {
              while (Date.now() - t0 < 60000) {
                try { if ((await fetch("http://localhost:4321/incrgame/")).ok) { console.log("preview up"); return; } } catch {}
                await new Promise((r) => setTimeout(r, 500));
              }
              console.log("::warning::preview server never came up");
            })();
          '
          node scripts/check-alignment.mjs 4321

  deploy:
    # The github-pages environment only allows the default (pinned) branch —
    # other branches get CI (build+test) but skip the publish instead of
    # failing on environment protection rules.
    if: github.ref == 'refs/heads/claude/incremental-game-github-pages-w7pvk6'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
