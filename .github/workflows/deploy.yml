# Build → test → deploy to GitHub Pages (SPEC.md "Deploy" section).
# Tests and the core-purity check GATE the deploy: red engine = no ship.
name: deploy

on:
  push:
    branches:
      - claude/incremental-game-github-pages-w7pvk6 # pinned deploy branch (no main)
      # ⚠️ REMOVED 2026-07-27: claude/project-review-build-shub7f.
      # It also published this site on "latest push wins", and it is NOT
      # contained in the dev branch — it carries commits dev does not. So any
      # push to it would have overwritten the live site with two-day-old code,
      # silently and with a green tick. A second publishing branch is a loaded
      # gun; if that work is wanted it gets merged into dev like anything else.
      # CI on the dev branch too. Four commits shipped without it ever
      # running — no tests, no core-purity check, no attribution gate. The
      # `deploy` job below stays gated to the pinned branch, so this buys the
      # checks without any publishing risk.
      - claude/knowledge-recovery-ontology-game-g0f9q0
  workflow_dispatch:

# Least privilege (SPEC): nothing beyond what deploy-pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx svelte-check --tsconfig ./tsconfig.json --fail-on-warnings false
      - name: Test (gates deploy)
        run: npx vitest run

      - name: Core-purity check
        # core/ must stay headless: no DOM globals, no clock, no RNG, no imports
        # from ui/render/shell. Was an inline grep over raw text, which flagged
        # the WORD "window" in a comment and silently blocked every deploy for a
        # day and a half — the build and deploy steps just get skipped, which
        # from outside is indistinguishable from a deploy. Now a script that
        # strips comments and strings first, with its red path tested.
        run: node scripts/check-core-purity.mjs
      # ⚠️ THREE GATES REMOVED, 2026-08-23, BECAUSE THEY GUARDED A DELETED GAME.
      #
      # THE VOCABULARY GATE went first, on 2026-08-16, and it broke twelve
      # deploys on the way out: it read `src/core/readouts.ts` — the pre-pivot
      # game — so it was made to exit 1 and say so, while still wired here as a
      # deploy gate that nobody had checked.
      #
      # THE STORY GRAPH and THE ONTOLOGY DATA are the same mistake, found by
      # reading the file rather than by a red run. `check-story.mjs` walks
      # `docs/graph/` and reports beats and lanes from the knowledge-recovery
      # game; the ontology step asserts a WordNet manifest ships in `public/`.
      # Neither describes anything the dungeon contains. A gate on a deleted
      # subject is not caution — it is a check that can only ever be wrong, and
      # it teaches everyone to route around the pipeline.
      #
      # ★ WHAT REPLACES THEM IS THE CHECK THAT ACTUALLY DESCRIBES THIS GAME:
      # the browser probe, below, driven with a thumb through the whole loop.
      - name: One word, one quantity
        # ⚠️ THE OLDEST UNENFORCED RULE IN THE PROJECT, and its previous check
        # was famously vacuous — it read the pre-pivot game, and `the-process`
        # printed two nouns for one quantity into the live HUD for exit 0. This
        # one reads `src/delve/words.ts`, where the vocabulary now lives in one
        # place, and the screens that render it. Four recorded sabotages.
        run: node scripts/check-vocab.mjs
      - run: npx vite build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ── The browser gate runs BESIDE the deploy, not in front of it ───────────
  #
  # ⚠️ I MOVED THIS INTO `build` AND BROKE THE DEPLOY, 2026-08-23 — in the same
  # commit whose message was about gates that block deploys. The reasoning
  # against it was already written here, by whoever wrote the old `visual` job,
  # and I deleted the paragraph rather than reading it: a real browser is slow
  # and flaky in a way a publish must not inherit, and one run held a deploy for
  # nine minutes. It failed for the dumbest possible reason on top of that —
  # no browser on the runner — so the fast gates all passed and the site did
  # not update.
  #
  # ★ WHAT CHANGED, AND WHAT DID NOT. The old job drove
  # `scripts/check-alignment.mjs`, which asserts geometry inside
  # `src/ui/App.svelte` — a screen this game has not shown since the pivot, so
  # it spent 75 seconds of browser per push proving something about a page
  # nobody can reach. The INSTINCT was right and the TARGET was stale, so the
  # target moved to `npm run delve` and the job stayed exactly where it was:
  # red on its own line when the game is broken, never able to take the site
  # down with it.
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # ⚠️ AND THE RUNNER HAS NO BROWSER. Locally this repo finds a pre-installed
      # Chromium under /opt/pw-browsers; a fresh runner has nothing, and
      # `play-delve.mjs` falls through to Playwright's own copy, which is not
      # there either. This is the line whose absence failed the deploy.
      - run: npx playwright install --with-deps chromium
      - name: Play it (a thumb through the whole loop)
        run: |
          npm run build
          npx vite preview --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          node -e '
            const t0 = Date.now();
            (async () => {
              while (Date.now() - t0 < 60000) {
                try { if ((await fetch("http://localhost:4173/incrgame/")).ok) return; } catch {}
                await new Promise((r) => setTimeout(r, 500));
              }
              console.error("::error::preview server never came up"); process.exit(1);
            })();
          '
          PLAY_URL=http://localhost:4173/incrgame/ node scripts/play-delve.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: play-*.png
          if-no-files-found: ignore

  deploy:
    # The github-pages environment only allows the default (pinned) branch —
    # other branches get CI (build+test) but skip the publish instead of
    # failing on environment protection rules.
    if: github.ref == 'refs/heads/claude/incremental-game-github-pages-w7pvk6'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
