<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale/user-scalable are load-bearing, not laziness: the board is a
         full-screen canvas sized from the layout viewport, and browser pinch-zoom
         moves the VISUAL viewport out from under it — on iOS the whole board
         collapsed into the top-left corner at a third scale. Pinch belongs to the
         game, not the browser. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Semantic Drift</title>
    <!-- iOS ignores manifest icons for the home screen; this link is load-bearing (SPEC.md) -->
    <link rel="apple-touch-icon" href="/incrgame/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Semantic Drift" />
    <meta name="theme-color" content="#0b0e14" />
    <link rel="icon" href="/incrgame/icon-192.png" type="image/png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
