<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Zoom is ALLOWED. `maximum-scale=1, user-scalable=no` used to be here and
         it was a mistake twice over: iOS has ignored it since iOS 10 (it is an
         accessibility decision), so it bought nothing there — and everywhere it
         IS honoured it removes the player's way out of a bad zoom state. The
         board now sizes itself from `visualViewport`, so zooming is harmless:
         it magnifies a board that still lays out complete. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Semantic Drift</title>
    <!-- iOS ignores manifest icons for the home screen; this link is load-bearing (SPEC.md) -->
    <link rel="apple-touch-icon" href="/incrgame/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Semantic Drift" />
    <meta name="theme-color" content="#e8e0d0" />
    <link rel="icon" href="/incrgame/icon-192.png" type="image/png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
